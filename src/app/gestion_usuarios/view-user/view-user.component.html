<section class="principal">
  <article class="sidebar">
    <app-side-bar (toggle)="sidebarVisible = !sidebarVisible"></app-side-bar>
  </article>

  <article class="content">
    <main class="page-content p-4">
      <section class="search-and-user">
        <div class="search-item-left">
          <mat-form-field appearance="outline">
            <mat-label>Buscar usuarios</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Buscar por nombre, correo..." />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>
        <div class="search-item-right">
          <button mat-raised-button color="primary" (click)="addUser()">Agregar Usuario</button>
        </div>

        <div class="admin-profile">
          <span class="greeting">{{ user }}</span>
          <div class="notifications">
            <mat-icon>group</mat-icon>
          </div>
        </div>
      </section>


      <section class="bg-white rounded-2xl shadow-md p-6">


        <div class="overflow-x-auto">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-full" matSort>

            <!-- Columnas -->
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
              <td mat-cell *matCellDef="let user">{{ user.id }}</td>
            </ng-container>

            <ng-container matColumnDef="imagen">
              <th mat-header-cell *matHeaderCellDef>Imagen</th>
              <td mat-cell *matCellDef="let user">
                <img [src]="'data:image/jpeg;base64,' + user.imagen" alt="Imagen del usuario"
                  class="w-12 h-12 rounded-full object-cover" />
              </td>
            </ng-container>

            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
              <td mat-cell *matCellDef="let user">{{ user.nombre }}</td>
            </ng-container>

            <ng-container matColumnDef="celularr">
              <th mat-header-cell *matHeaderCellDef>Celular</th>
              <td mat-cell *matCellDef="let user">{{ user.celularr }}</td>
            </ng-container>

            <ng-container matColumnDef="correo">
              <th mat-header-cell *matHeaderCellDef>Correo</th>
              <td mat-cell *matCellDef="let user">{{ user.correo }}</td>
            </ng-container>

            <ng-container matColumnDef="rol">
              <th mat-header-cell *matHeaderCellDef>Rol</th>
              <td mat-cell *matCellDef="let user">{{ user.rol }}</td>
            </ng-container>

            <ng-container matColumnDef="estado">
              <th mat-header-cell *matHeaderCellDef>Estado</th>
              <td mat-cell *matCellDef="let user">
                <mat-slide-toggle [checked]="user.estado.trim() === 'ACTIVO'" (change)="toggleUserStatus(user)">
                </mat-slide-toggle>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let user">
                <button mat-icon-button color="primary" (click)="editUser(user)">
                  <mat-icon>edit</mat-icon>
                </button>
              </td>
            </ng-container>

            <!-- Filas -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

        <mat-paginator [length]="dataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons>
        </mat-paginator>
      </section>
    </main>
  </article>
</section>
