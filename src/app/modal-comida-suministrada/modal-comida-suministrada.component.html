<!-- modal-comida-suministrada.component.html -->
<div class="custom-modal">
    <div class="modal-content">
        <span class="close-btn" (click)="onCancel()">&times;</span>
        <form (ngSubmit)="onSubmit()" #comidaForm="ngForm">
            <div class="form-group">
                <label for="user">Usuario:</label>
                <span class="greeting">{{ user }}</span>
            </div>
            <div class="form-group">
                <label for="corral_id">Corral:</label>
                <input type="number" id="corral_id" [(ngModel)]="nuevoProducto.corral_id" name="corral_id" required>
            </div>
            <mat-form-field appearance="fill">
                <mat-label>Producto</mat-label>
                <mat-select [(ngModel)]="nuevoProducto.producto_id" name="producto_id" required>
                    <mat-option *ngFor="let prod of productos" [value]="prod.id_producto">
                        {{ prod.nombre_producto }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <div class="form-group">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" [(ngModel)]="nuevoProducto.cantidad" name="cantidad" required>
            </div>
            <button type="submit" [disabled]="comidaForm.invalid">Agregar Comida</button>
        </form>
    </div>
</div>
